<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Letterboxd Watchlist Matcher</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Free lookalikes for Letterboxd's licensed TiemposHeadlineWeb / GraphikWeb
       (both commercial fonts we can't legally rehost) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=32" />
</head>
<body>
  <main>
    <div id="hero-group">
      <header class="page-header">
        <div class="title-row">
          <img src="assets/favicon.svg" alt="" class="title-icon" width="40" height="40" />
          <h1>Watchlist Matcher</h1>
        </div>
        <p class="subtitle">
          Enter multiple Letterboxd usernames to find shared movies across their watchlists.
        </p>
      </header>

      <form id="matcher-form">
        <div class="username-bar-row" id="username-bar-row">
          <input
            type="text"
            id="username-input"
            class="username-bar"
            placeholder="Enter Letterboxd usernames separated by a space"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" id="submit-btn" class="btn btn-primary" disabled>Find shared movies</button>
        </div>

        <div class="chips-and-startover" id="chips-and-startover">
          <div id="username-chips" class="username-chips"></div>
          <button type="button" id="start-over-btn" class="btn btn-accent">Start over</button>
        </div>
      </form>
    </div>

    <section id="results-content" hidden>
      <section id="status" class="status" hidden aria-live="polite">
        <img src="assets/loading-icon.svg" alt="" class="status-icon" width="24" height="24" />
        <span id="status-text"></span>
      </section>

      <section id="errors" class="errors" hidden></section>

      <div id="results" class="results film-grid"></div>
    </section>
  </main>

  <footer class="page-footer">
    <p>
      Not affiliated with Letterboxd. Reads public watchlist pages only &mdash;
      be considerate with how many accounts and how often you run this.
    </p>
  </footer>

  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/CustomEase.min.js" defer></script>
  <script src="app.js?v=27" defer></script>
</body>
</html>
